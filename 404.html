<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0d14">
<title>Sidan finns inte – Fantasy Rinken</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#131b2e 0,#0a0d14 620px);background-color:#0a0d14;color:#e2e8f0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18vh 16px 48px;text-align:center}
.card{background:#131b2e;border:1px solid #2d323e;border-radius:18px;padding:28px 22px}
h1{font-size:1.4rem;margin:0 0 8px}p{color:#8a93a3;margin:0 0 20px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:12px;background:linear-gradient(135deg,#e2e8f0,#a9c3ec);color:#0a0d14;font-weight:800;text-decoration:none}
a:focus-visible{outline:2px solid #a9c3ec;outline-offset:3px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>Offside – sidan finns inte</h1>
<p>Länken är fel eller sidan har flyttats.</p>
<a id="home" href="/">Till Fantasy Rinken</a>
</div>
</main>
<script>
// 404-sidan visas på vilken djup adress som helst, så relativa länkar fungerar inte här.
// Sajtens rot: "/" på egen domän, "/<repo>/" på github.io (projektsida).
(function () {
  var seg = location.pathname.split('/')[1];
  var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
  document.getElementById('home').href = base;
  document.querySelector('link[rel=icon]').href = base + 'icon-192.png';
})();
</script>
</body>
</html>
